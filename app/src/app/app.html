<div [innerHTML]="sprite"></div>

<div class="flex min-h-screen">
  <!-- Sidebar -->
  <aside class="border-border bg-card flex w-56 shrink-0 flex-col border-r">
    <a routerLink="/live" class="flex items-center gap-2.5 px-5 py-5">
      <img src="favicon.svg" alt="" class="h-7 w-7" />
      <span class="text-lg font-semibold tracking-tight">Fordism</span>
    </a>

    <nav class="flex-1 space-y-6 px-3 py-2">
      <div>
        <div class="text-muted-foreground px-2 pb-1 text-[11px] font-semibold tracking-wider uppercase">Operate</div>
        @for (item of operate; track item.path) {
          <a
            [routerLink]="item.path"
            routerLinkActive="bg-primary/10 text-primary"
            class="text-foreground/80 hover:bg-foreground/5 flex items-center gap-2.5 rounded-lg px-2 py-1.5 text-sm font-medium"
          >
            <app-icon [name]="item.icon" class="text-base" />
            {{ item.label }}
            @if (item.path === '/live' && attention.askedCount() > 0) {
              <span class="ml-auto rounded-full bg-amber-500/20 px-1.5 text-xs font-semibold text-amber-600 dark:text-amber-400">
                {{ attention.askedCount() }}
              </span>
            }
          </a>
        }
      </div>
      <div>
        <div class="text-muted-foreground px-2 pb-1 text-[11px] font-semibold tracking-wider uppercase">Configure</div>
        @for (item of configure; track item.path) {
          <a
            [routerLink]="item.path"
            routerLinkActive="bg-primary/10 text-primary"
            class="text-foreground/80 hover:bg-foreground/5 flex items-center gap-2.5 rounded-lg px-2 py-1.5 text-sm font-medium"
          >
            <app-icon [name]="item.icon" class="text-base" />
            {{ item.label }}
          </a>
        }
      </div>
    </nav>

    <div class="border-border border-t px-3 py-3">
      <button hlmBtn variant="outline" class="w-full" (click)="toggleScheme()">
        <app-icon name="sun" class="dark:hidden" />
        <app-icon name="moon" class="hidden dark:inline-flex" />
        Appearance
      </button>
    </div>
  </aside>

  <!-- Content -->
  <main class="min-w-0 flex-1 px-8 py-6">
    <router-outlet />
  </main>
</div>

<hlm-toaster richColors closeButton />
