<div
  class="mx-auto flex w-full max-w-[64rem] flex-auto flex-col p-6 lg:px-10 lg:py-8"
>
  <div class="flex flex-wrap items-center justify-between gap-4">
    <div class="flex items-center gap-x-3.5">
      <div
        class="flex size-10 shrink-0 items-center justify-center rounded-lg border border-white/5 bg-white/[0.03]"
      >
        <mat-icon
          svgIcon="package"
          class="text-primary icon-size-6"
        />
      </div>
      <div>
        <h1 class="leading-tight text-2xl font-semibold tracking-tight">
          Agent templates
        </h1>
        <p class="text-secondary text-sm">
          What an agent runs with — its model, skills, credentials and
          instructions.
        </p>
      </div>
    </div>
    <a
      mat-flat-button
      color="primary"
      routerLink="/templates/new"
    >
      <mat-icon svgIcon="plus" />New template
    </a>
  </div>

  @if (error()) {
    <div
      class="mt-4 rounded-lg border border-red-500/30 bg-red-500/[0.07] px-3 py-2 text-sm text-red-300"
    >
      {{ error() }}
    </div>
  }

  <div
    class="mt-6 divide-y divide-white/5 rounded-xl border border-white/5 bg-white/[0.02]"
  >
    @for (t of templates(); track t.id) {
      <a
        class="flex items-center gap-3 px-4 py-3 transition-colors hover:bg-white/[0.03]"
        [routerLink]="['/templates', t.id]"
      >
        <mat-icon
          svgIcon="package"
          class="text-secondary icon-size-4 shrink-0"
        />
        <span class="font-medium">{{ t.name }}</span>
        <span class="flex-auto"></span>
        <mat-icon
          svgIcon="chevron-right"
          class="text-secondary icon-size-4"
        />
      </a>
    } @empty {
      <div class="text-secondary px-4 py-16 text-center text-sm">
        No templates yet.
      </div>
    }
  </div>
</div>
