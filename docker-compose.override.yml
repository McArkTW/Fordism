# Local/dev build override (auto-merged by `docker compose`), and used by CI to build
# the images from source. On a server: docker compose -f docker-compose.yml up -d (pulls).
services:
  fordism-core:
    build:
      context: .                 # repo root — core/Dockerfile COPYs core/ (src, lib, workflows)
      dockerfile: core/Dockerfile
  fordism-app:
    build: ./app
  # Built, never run: the launcher spawns one container per task from these. The base carries the
  # shared runtime; each tool image is that base plus its own CLI.
  fordism-agent-base:
    build:
      context: ./agent
      dockerfile: Dockerfile.base
  fordism-agent-claude-code:
    build:
      context: ./agent
      dockerfile: tools/claude-code.Dockerfile
      args:
        BASE: ${REGISTRY:-ghcr.io/mcarktw/fordism}/fordism-agent-base:${TAG:-latest}
  fordism-agent-qwen-code:
    build:
      context: ./agent
      dockerfile: tools/qwen-code.Dockerfile
      args:
        BASE: ${REGISTRY:-ghcr.io/mcarktw/fordism}/fordism-agent-base:${TAG:-latest}
  fordism-agent-gemini-cli:
    build:
      context: ./agent
      dockerfile: tools/gemini-cli.Dockerfile
      args:
        BASE: ${REGISTRY:-ghcr.io/mcarktw/fordism}/fordism-agent-base:${TAG:-latest}
  fordism-agent-codex:
    build:
      context: ./agent
      dockerfile: tools/codex.Dockerfile
      args:
        BASE: ${REGISTRY:-ghcr.io/mcarktw/fordism}/fordism-agent-base:${TAG:-latest}
  fordism-agent-opencode:
    build:
      context: ./agent
      dockerfile: tools/opencode.Dockerfile
      args:
        BASE: ${REGISTRY:-ghcr.io/mcarktw/fordism}/fordism-agent-base:${TAG:-latest}
