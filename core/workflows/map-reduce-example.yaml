name: map-reduce-example
description: Fan the map step out over each item in a list parameter (one task per item), then reduce the results into one.
strategy: map-reduce
parameters: [items]
steps:
  - id: map
    template: generic
    config: {network: full}   # the agent reaches its model provider; the default is none
    forEach: ${items}
    task: |
      Write a two-sentence summary of the topic: ${item}
  - id: reduce
    template: generic
    config: {network: full}   # the agent reaches its model provider; the default is none
    task: |
      Combine the per-topic summaries in task/previous-result/ (one folder per
      topic) into a single short overview.
    includePreviousResult: true
