# CI: secret scan + both builds with their gates on every PR and push to main;
# a v* tag additionally builds and pushes the three images to GHCR.
name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans history, not just the tip
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . -v

  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      # banVar + banStyle + all tests ride inside `build`
      - run: chmod +x gradlew && ./gradlew build --no-daemon
        working-directory: core

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm run lint
        working-directory: app
      - run: npm run test
        working-directory: app
      - run: npm run build
        working-directory: app

  images:
    # Compose-build all three images so a Dockerfile break fails the PR;
    # push to GHCR only when a release tag made it through the other jobs.
    needs: [secret-scan, core, app]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose --profile build-only build
        env:
          REGISTRY: ghcr.io/${{ github.repository }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'ci' }}
          FORDISM_VERSION: ${{ github.ref_name }}
          FORDISM_GIT_SHA: ${{ github.sha }}
      - name: Push images
        if: github.ref_type == 'tag'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          for image in fordism-core fordism-app fordism-agent; do
            docker push "ghcr.io/${{ github.repository }}/${image}:${{ github.ref_name }}"
          done
