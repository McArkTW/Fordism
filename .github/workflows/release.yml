# Release: on a v* tag, run the same gates ci.yml does, then build core and app for amd64 and
# arm64 — each on a NATIVE runner (no QEMU), so arm64 is minutes, not the ~50 the emulated build
# took — push a per-arch tag, and merge the two into one multi-arch tag. Finally cut a GitHub
# Release. The agent image is deliberately NOT published (it bakes in proprietary CLIs; operators
# build it themselves). This is the only workflow that pushes.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  # The release must not be able to publish something that would have failed CI.
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans history, not just the tip
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . -v
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      # banVar + banStyle + all tests ride inside `build`
      - run: chmod +x gradlew && ./gradlew build --no-daemon
        working-directory: core
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm run lint
        working-directory: app
      - run: npm run test
        working-directory: app

  # One job per image PER ARCH, each on its own native runner. Each pushes a per-arch tag
  # (…:vX.Y.Z-amd64 / -arm64); the merge job below stitches them into the real multi-arch tag.
  build:
    needs: gates
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: fordism-core, context: ".",     dockerfile: core/Dockerfile, arch: amd64, runner: ubuntu-24.04 }
          - { image: fordism-core, context: ".",     dockerfile: core/Dockerfile, arch: arm64, runner: ubuntu-24.04-arm }
          - { image: fordism-app,  context: "./app", dockerfile: app/Dockerfile,  arch: amd64, runner: ubuntu-24.04 }
          - { image: fordism-app,  context: "./app", dockerfile: app/Dockerfile,  arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Registry name
        run: echo "REGISTRY=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Build and push ${{ matrix.image }} (${{ matrix.arch }})
        run: |
          docker buildx build --platform "linux/${{ matrix.arch }}" \
            -f "${{ matrix.dockerfile }}" \
            -t "${REGISTRY}/${{ matrix.image }}:${GITHUB_REF_NAME}-${{ matrix.arch }}" \
            --push "${{ matrix.context }}"

  # Stitch the per-arch tags into one multi-arch tag (:vX.Y.Z and :latest), confirm both platforms
  # are in the manifest, then cut the Release. No build here — just manifest assembly + publish.
  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Registry name
        run: echo "REGISTRY=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Merge per-arch tags into a multi-arch manifest
        run: |
          for image in fordism-core fordism-app; do
            for target in "${GITHUB_REF_NAME}" latest; do
              docker buildx imagetools create -t "${REGISTRY}/${image}:${target}" \
                "${REGISTRY}/${image}:${GITHUB_REF_NAME}-amd64" \
                "${REGISTRY}/${image}:${GITHUB_REF_NAME}-arm64"
            done
          done

      - name: Manifest lists both platforms
        run: |
          for image in fordism-core fordism-app; do
            platforms="$(docker buildx imagetools inspect "${REGISTRY}/${image}:${GITHUB_REF_NAME}" \
                         | grep -oE 'linux/(amd64|arm64)' | sort -u | tr '\n' ' ')"
            echo "${image}: ${platforms}"
            case "$platforms" in *linux/amd64*) ;; *) echo "  missing linux/amd64" >&2; exit 1 ;; esac
            case "$platforms" in *linux/arm64*) ;; *) echo "  missing linux/arm64" >&2; exit 1 ;; esac
          done

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # CHANGELOG headings carry no leading v: tag v1.0.0 -> "## 1.0.0 ...".
          ver="${GITHUB_REF_NAME#v}"
          awk -v ver="$ver" '
            !hit && $0 ~ ("^## " ver "([^0-9.]|$)") { hit = 1; next }
            hit && /^## / { exit }
            hit { print }
          ' CHANGELOG.md > body.md
          if ! grep -q '[^[:space:]]' body.md; then
            echo "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md)." > body.md
          fi
          # Idempotent: a re-tagged release updates the existing one instead of failing.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file body.md --target "$GITHUB_SHA"
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file body.md --target "$GITHUB_SHA"
          fi
